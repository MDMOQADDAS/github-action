name: Build and Version

on:
  push:
    branches:
      - gitversion

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion to access full git history

      # Setup .NET (assuming you're using a .NET project)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.0'  # Adjust based on your needs

      # Install GitVersion
      - name: Install GitVersion
        run: dotnet tool install --global GitVersion.Tool

      # Calculate version
      - name: Calculate version with GitVersion
        id: gitversion
        run: |
          VERSION=$(dotnet-gitversion /output json)
          echo "Calculated Version: $VERSION"
          
          # Extract specific version components
          SEMVER=$(echo $VERSION | jq -r .SemVer)
          MAJOR=$(echo $VERSION | jq -r .Major)
          MINOR=$(echo $VERSION | jq -r .Minor)
          PATCH=$(echo $VERSION | jq -r .Patch)
          
          # Set outputs for later steps
          echo "version=$SEMVER" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

      # Example: Use the version in subsequent steps
      - name: Build with version
        run: |
          echo "Building version ${{ steps.gitversion.outputs.version }}"
          # Add your build commands here, e.g.:
          # dotnet build --configuration Release /p:Version=${{ steps.gitversion.outputs.version }}

